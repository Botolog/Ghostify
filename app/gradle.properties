org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The Kotlin compile daemon fails to start on this constrained aarch64 machine;
# compile in-process instead.
kotlin.compiler.execution.strategy=in-process

# ARM64 developers: add android.aapt2FromMavenOverride to local.properties
# e.g. android.aapt2FromMavenOverride=/path/to/aapt2
