org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The Kotlin compile daemon fails to start on this constrained aarch64 machine;
# compile in-process instead.
kotlin.compiler.execution.strategy=in-process

# This machine is aarch64; Google publishes no arm64 aapt2. We run the x86_64
# aapt2 under qemu-user-static via this wrapper (see /opt/aapt2).
android.aapt2FromMavenOverride=/opt/aapt2/aapt2
